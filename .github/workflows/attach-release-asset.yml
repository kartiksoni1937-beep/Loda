name: Attach release asset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/attach-release-asset.yml"
      - "release/odinclient-1.3.0.jar"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload jar to the 1.3.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload 1.3.0 release/odinclient-1.3.0.jar --clobber
